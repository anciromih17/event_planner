services:
  - type: web
    name: event-planner
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    disk:
      name: event-planner-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/event_planner.db
      - key: GOOGLE_CREDENTIALS_PATH
        value: /etc/secrets/credentials.json
      - key: GOOGLE_TOKEN_PATH
        value: /etc/secrets/token.json
